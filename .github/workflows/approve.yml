name: Approve

# workflow_call only -- invoked by pipeline.yml after the image is built.
#
# Real gate, not a stub: `environment: approval-gate` has a
# required-reviewer protection rule, so this job pauses for manual
# approve/reject in the GitHub UI before its steps run at all.
#
# Note on a red herring: a `run:` value containing an unquoted colon+space
# (e.g. "Approved: deploying...") breaks GitHub's workflow parser -- it's a
# plain YAML scalar, and ": " is a mapping-key indicator YAML disallows
# there. That surfaced as a misleading "yaml syntax" error pointing at the
# run line, which looked at first like it was caused by the environment
# key's bare-string form -- it wasn't; confirmed by testing each
# independently.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      target_environment:
        required: true
        type: string

jobs:
  approve:
    runs-on: ubuntu-latest
    environment: approval-gate
    steps:
      - name: Approved
        run: echo "Approved -- deploying '${{ inputs.service }}' to '${{ inputs.target_environment }}'."
