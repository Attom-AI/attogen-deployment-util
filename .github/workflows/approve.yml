name: Approve

# workflow_call only -- invoked by pipeline.yml after the image is built.
#
# Stub. The real mechanism is a GitHub Environment with required reviewers
# -- a job targeting that environment pauses for manual approve/reject in
# the GitHub UI before continuing. Naming the environment and picking
# reviewers is left for later; this just echoes in its place.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment:
        required: true
        type: string

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approval gate (stub)
        run: echo "Would pause here for manual approval before deploying '${{ inputs.service }}' to '${{ inputs.environment }}'. Not yet implemented."
