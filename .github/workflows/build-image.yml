name: Build image

# workflow_call only -- invoked by pipeline.yml after init passes.
#
# Pushes to ghcr.io/attom-ai/forgen -- attogen's own package, not a
# personal-namespace fallback -- authenticated with GHCR_TOKEN, a classic
# PAT (write:packages) belonging to someone with write on that package.
# GITHUB_TOKEN can't do it: this repo lives outside the Attom-AI org, and
# the push was refused with "The requested installation does not exist."
# Like ATTOGEN_READ_TOKEN, GHCR_TOKEN is set by hand, out of band.
#
# Tags are util-<sha12>-<service>, never attogen's k3s-<sha12>-<service>:
# building the same commit under attogen's scheme would overwrite
# attogen's own tag, and a util- tag can never satisfy attogen's
# deploy-k3s.yml digest regexes.
#
# Outputs image_ref (<tag>@<digest>) for deploy.yml to roll -- by digest,
# never by the mutable tag. Empty for minio, which builds nothing.

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      branch:
        required: true
        type: string
      service:
        required: true
        type: string
    secrets:
      ATTOGEN_READ_TOKEN:
        required: true
      GHCR_TOKEN:
        required: true
    outputs:
      image_ref:
        description: "Pushed image as <tag>@<digest>; empty for minio"
        value: ${{ jobs.build-image.outputs.image_ref }}

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - name: Checkout ${{ inputs.repo }}@${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.ATTOGEN_READ_TOKEN }}
          path: attogen
          persist-credentials: false

      # MinIO runs the stock minio/minio image -- attogen has no
      # Dockerfile for it, so there is nothing to build here, ever, for
      # this service. Matches converter/pipeline below only in shape,
      # not in reason: this isn't deferred, it's a permanent no-op.
      - name: MinIO (deploy-only, nothing to build)
        if: inputs.service == 'minio'
        run: |
          echo "MinIO runs the stock minio/minio image -- attogen has no Dockerfile for it."
          echo "Nothing to build here; it goes straight from manifest to deploy."

      - name: Resolve build metadata
        if: inputs.service != 'minio'
        id: meta
        working-directory: attogen
        run: |
          case "${{ inputs.service }}" in
            converter) echo "dockerfile=services/document_conversion/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            pipeline)  echo "dockerfile=services/opportunity_pipeline/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unknown service '${{ inputs.service }}' -- expected converter, pipeline, or minio."
              exit 1
              ;;
          esac
          echo "tag=ghcr.io/attom-ai/forgen:util-$(git rev-parse --short=12 HEAD)-${{ inputs.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: inputs.service != 'minio'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.service != 'minio'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Repo root as build context, not the service's own subdirectory --
      # both Dockerfiles copy shared modules out of sales/core/hub rather
      # than carrying their own copy (each file's own header comment says
      # so explicitly).
      - name: Build and push image
        if: inputs.service != 'minio'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: attogen
          file: attogen/${{ steps.meta.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=forgen-${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=forgen-${{ inputs.service }}
          provenance: false

      - name: Emit image ref
        if: inputs.service != 'minio'
        id: ref
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image_ref=${TAG}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${TAG}@${DIGEST}"
