name: Build image

# workflow_call only -- invoked by pipeline.yml after init passes.
#
# Pushes to ghcr.io/attom-ai/forgen -- attogen's own package, not a
# personal-namespace fallback. This requires an Attom-AI admin to grant
# this repo access ("Manage Actions access" on the forgen package, or a
# direct package-level grant to this repo's owner) before the push step
# below can succeed -- an external, out-of-band dependency, same as
# ATTOGEN_READ_TOKEN needing to be set by hand before init.yml worked
# end-to-end. Checkout and image build can be verified before that grant
# exists; only the final push is blocked until then.

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      branch:
        required: true
        type: string
      service:
        required: true
        type: string
    secrets:
      ATTOGEN_READ_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ inputs.repo }}@${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.ATTOGEN_READ_TOKEN }}
          path: attogen
          persist-credentials: false

      # MinIO runs the stock minio/minio image -- attogen has no
      # Dockerfile for it, so there is nothing to build here, ever, for
      # this service. Matches converter/pipeline below only in shape,
      # not in reason: this isn't deferred, it's a permanent no-op.
      - name: MinIO (deploy-only, nothing to build)
        if: inputs.service == 'minio'
        run: |
          echo "MinIO runs the stock minio/minio image -- attogen has no Dockerfile for it."
          echo "Nothing to build here; it goes straight from manifest to deploy."

      - name: Resolve build metadata
        if: inputs.service != 'minio'
        id: meta
        working-directory: attogen
        run: |
          case "${{ inputs.service }}" in
            converter) echo "dockerfile=services/document_conversion/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            pipeline)  echo "dockerfile=services/opportunity_pipeline/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unknown service '${{ inputs.service }}' -- expected converter, pipeline, or minio."
              exit 1
              ;;
          esac
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: inputs.service != 'minio'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.service != 'minio'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repo root as build context, not the service's own subdirectory --
      # both Dockerfiles copy shared modules out of sales/core/hub rather
      # than carrying their own copy (each file's own header comment says
      # so explicitly).
      - name: Build and push image
        if: inputs.service != 'minio'
        uses: docker/build-push-action@v6
        with:
          context: attogen
          file: attogen/${{ steps.meta.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/attom-ai/forgen:k3s-${{ steps.meta.outputs.short_sha }}-${{ inputs.service }}
          cache-from: type=gha,scope=forgen-${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=forgen-${{ inputs.service }}
          provenance: false
