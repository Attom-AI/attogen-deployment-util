name: Init

# workflow_call only -- invoked by pipeline.yml, never dispatched directly.
#
# A validation gate: fetch, install, run the pipeline service's real test
# suite. If nothing fails, requirements are satisfied. Straight-line steps,
# scoped to pipeline only -- no per-service branching.

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      branch:
        required: true
        type: string
    secrets:
      ATTOGEN_READ_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      # ATTOGEN_READ_TOKEN is scoped to Attom-AI/attogen only, though repo
      # is a generic input -- fail fast with a readable message rather than
      # let checkout below surface GitHub's opaque "repository not found."
      - name: Setup
        if: inputs.repo != 'Attom-AI/attogen'
        run: |
          echo "::error::ATTOGEN_READ_TOKEN is only scoped to Attom-AI/attogen; got '${{ inputs.repo }}'."
          exit 1

      # path: attogen keeps this out of the workspace root, for whatever a
      # later stage keeps there. persist-credentials: false so the PAT
      # isn't left in the runner's git config for later steps.
      - name: Checkout ${{ inputs.repo }}@${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.ATTOGEN_READ_TOKEN }}
          path: attogen
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # matches the service's own Dockerfile base image

      - name: Install dependencies
        run: |
          pip install -r attogen/services/opportunity_pipeline/requirements.txt
          pip install pytest

      # python -m pytest (not bare pytest) puts the invocation directory on
      # sys.path, which the pipeline's repo-root-relative imports (sales.,
      # core., hub.) need.
      #
      # pytest.ini here (uncommitted) pre-empts attogen's own root
      # pytest.ini, which requires pytest-django (not installed here) and
      # would otherwise abort the run. --confcutdir separately stops
      # conftest.py discovery from reaching attogen's root conftest.py,
      # which imports Django directly.
      #
      # test_document_reader.py is excluded: its import chain reaches
      # django.core.files, unlike the rest of the suite.
      - name: Run pipeline tests
        working-directory: attogen
        run: |
          echo "[pytest]" > services/opportunity_pipeline/pytest.ini
          python -m pytest services/opportunity_pipeline/tests \
            --confcutdir=services/opportunity_pipeline \
            --ignore=services/opportunity_pipeline/tests/test_document_reader.py \
            -v

      - name: Complete
        run: echo "Init gate passed -- requirements satisfied."
