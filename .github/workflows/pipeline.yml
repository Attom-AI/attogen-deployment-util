name: Pipeline

# The one workflow_dispatch entry point -- everything else is a reusable
# workflow (on: workflow_call) this one calls, not dispatched directly by a
# human. Replaces the earlier single file named "Deploy," which was
# misleading once it only did fetch+build+test and nothing resembling a
# deploy yet.
#
# `init` is a VALIDATION GATE, scoped to the pipeline service specifically --
# see init.yml. Adding a stage later (publish, deploy) means a new reusable
# workflow file plus one new job here calling it with `needs:` -- not a
# rewrite of this file or init.yml. Each stage keeps its own runs-on
# independent of the others, which matters concretely once deploy exists:
# attogen's own deploy-k3s.yml requires a self-hosted runner (reaches the
# cluster's private network), while init/publish need nothing special -- a
# constraint a single flat job couldn't satisfy at all.
#
# `service`/`environment` are captured here but not yet passed to anything --
# init.yml doesn't take a `service` input at all (it only validates
# pipeline). They're reserved for the publish/deploy jobs that will need
# them; passing them through before a consumer exists would just be an
# unused parameter one level down.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to fetch (owner/repo)"
        required: true
        type: string
        default: "Attom-AI/attogen"
      branch:
        description: "Branch to fetch"
        required: true
        type: string
        default: "main"
      service:
        description: "Which service to build+publish+deploy (unused until those stages exist; init always validates pipeline)"
        required: true
        type: string
      environment:
        description: "Target deploy environment (unused until publish/deploy stages exist)"
        required: true
        type: string
        default: "k3s"

jobs:
  init:
    uses: ./.github/workflows/init.yml
    with:
      repo: ${{ inputs.repo }}
      branch: ${{ inputs.branch }}
    secrets: inherit
