name: Pipeline

# The one workflow_dispatch entry point. Everything else is a reusable
# workflow (on: workflow_call) invoked from here, never dispatched directly.
#
# `init` is a validation gate scoped to the pipeline service (see init.yml).
# Adding publish/deploy later means a new reusable workflow file plus one
# new job here -- each stage keeps its own runs-on, since deploy will need
# a self-hosted runner (attogen's own deploy-k3s.yml requires one to reach
# the cluster's private network), which init does not.
#
# `service`/`environment` are captured but unused until publish/deploy
# exist and need them.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to fetch (owner/repo)"
        required: true
        type: string
        default: "Attom-AI/attogen"
      branch:
        description: "Branch to fetch"
        required: true
        type: string
        default: "main"
      service:
        description: "Which service to build+publish+deploy (unused until those stages exist; init always validates pipeline)"
        required: true
        type: string
      environment:
        description: "Target deploy environment (unused until publish/deploy stages exist)"
        required: true
        type: string
        default: "k3s"

jobs:
  init:
    uses: ./.github/workflows/init.yml
    with:
      repo: ${{ inputs.repo }}
      branch: ${{ inputs.branch }}
    secrets: inherit
