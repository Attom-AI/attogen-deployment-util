name: Pipeline

# The one workflow_dispatch entry point. Everything else is a reusable
# workflow (on: workflow_call) invoked from here, never dispatched directly.
#
# init validates; build-image builds+pushes to ghcr.io/attom-ai/forgen;
# approve is a real GitHub Environment gate (required reviewer); deploy
# rolls the pushed digest onto k3s. Each stage keeps its own runs-on
# independent of the others -- deploy runs on a self-hosted runner on the
# cluster's private network (label k3s-util); the others don't need one.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to fetch (owner/repo)"
        required: true
        type: string
        default: "Attom-AI/attogen"
      branch:
        description: "Branch to fetch"
        required: true
        type: string
        default: "main"
      service:
        description: "Which service to build/approve/deploy (init always validates pipeline regardless)"
        required: true
        type: string
      environment:
        description: "Target deploy environment"
        required: true
        type: string
        default: "k3s"

# contents: read only -- build-image pushes with the GHCR_TOKEN PAT, not
# GITHUB_TOKEN, so packages: write is no longer needed here.
permissions:
  contents: read

jobs:
  init:
    name: Setup
    uses: ./.github/workflows/init.yml
    with:
      repo: ${{ inputs.repo }}
      branch: ${{ inputs.branch }}
    secrets: inherit

  build-image:
    name: Build Image
    needs: init
    uses: ./.github/workflows/build-image.yml
    with:
      repo: ${{ inputs.repo }}
      branch: ${{ inputs.branch }}
      service: ${{ inputs.service }}
    secrets: inherit

  approve:
    name: Manual Approval
    needs: build-image
    uses: ./.github/workflows/approve.yml
    with:
      service: ${{ inputs.service }}
      target_environment: ${{ inputs.environment }}

  deploy:
    name: Deploy
    needs: [build-image, approve]
    uses: ./.github/workflows/deploy.yml
    with:
      service: ${{ inputs.service }}
      environment: ${{ inputs.environment }}
      image_ref: ${{ needs.build-image.outputs.image_ref }}
