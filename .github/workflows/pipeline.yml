name: Pipeline

# The one workflow_dispatch entry point. Everything else is a reusable
# workflow (on: workflow_call) invoked from here, never dispatched directly.
#
# init validates; build-image, approve, and deploy are stubs (echo only for
# now). Each stage keeps its own runs-on independent of the others -- that
# matters concretely once deploy is real: it will need a self-hosted runner
# to reach the cluster's private network, which the others do not.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to fetch (owner/repo)"
        required: true
        type: string
        default: "Attom-AI/attogen"
      branch:
        description: "Branch to fetch"
        required: true
        type: string
        default: "main"
      service:
        description: "Which service to build/approve/deploy (init always validates pipeline regardless)"
        required: true
        type: string
      environment:
        description: "Target deploy environment"
        required: true
        type: string
        default: "k3s"

jobs:
  init:
    name: Validate
    uses: ./.github/workflows/init.yml
    with:
      repo: ${{ inputs.repo }}
      branch: ${{ inputs.branch }}
    secrets: inherit

  build-image:
    name: Build Image
    needs: init
    uses: ./.github/workflows/build-image.yml
    with:
      service: ${{ inputs.service }}

  approve:
    name: Manual Approval
    needs: build-image
    uses: ./.github/workflows/approve.yml
    with:
      service: ${{ inputs.service }}
      target_environment: ${{ inputs.environment }}

  deploy:
    name: Deploy
    needs: approve
    uses: ./.github/workflows/deploy.yml
    with:
      service: ${{ inputs.service }}
      environment: ${{ inputs.environment }}
