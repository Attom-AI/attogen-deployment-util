name: Pipeline

# The one workflow_dispatch entry point. Everything else is a reusable
# workflow (on: workflow_call) invoked from here, never dispatched directly.
#
# init validates; build-image builds+pushes to ghcr.io/attom-ai/forgen;
# approve is a real GitHub Environment gate (required reviewer). deploy is
# still a stub (echo only). Each stage keeps its own runs-on independent of
# the others -- that matters concretely once deploy is real: it will need a
# self-hosted runner to reach the cluster's private network, which the
# others do not.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to fetch (owner/repo)"
        required: true
        type: string
        default: "Attom-AI/attogen"
      branch:
        description: "Branch to fetch"
        required: true
        type: string
        default: "main"
      service:
        description: "Which service to build/approve/deploy (init always validates pipeline regardless)"
        required: true
        type: string
      environment:
        description: "Target deploy environment"
        required: true
        type: string
        default: "k3s"

# packages: write is required for build-image's GHCR push -- reusable-workflow
# token permissions are the intersection of caller and callee, so this has to
# be declared here, not just in build-image.yml, or the repo/org default
# (typically read-only) is all that ever reaches that job.
permissions:
  contents: read
  packages: write

jobs:
  init:
    name: Setup
    uses: ./.github/workflows/init.yml
    with:
      repo: ${{ inputs.repo }}
      branch: ${{ inputs.branch }}
    secrets: inherit

  build-image:
    name: Build Image
    needs: init
    uses: ./.github/workflows/build-image.yml
    with:
      repo: ${{ inputs.repo }}
      branch: ${{ inputs.branch }}
      service: ${{ inputs.service }}
    secrets: inherit

  approve:
    name: Manual Approval
    needs: build-image
    uses: ./.github/workflows/approve.yml
    with:
      service: ${{ inputs.service }}
      target_environment: ${{ inputs.environment }}

  deploy:
    name: Deploy
    needs: approve
    uses: ./.github/workflows/deploy.yml
    with:
      service: ${{ inputs.service }}
      environment: ${{ inputs.environment }}
